# Dependabot opens (at most) one PR per ecosystem per month with all updates grouped.
# CI builds the site on the PR; if it's green, just click "Merge".
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      gems:
        patterns: ["*"]
